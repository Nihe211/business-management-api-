spring.application.name=business-management-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CẤU HÌNH JPA / HIBERNATE ---
# Tự động tạo/cập nhật bảng từ Entity
spring.jpa.hibernate.ddl-auto=update

# Hiển thị và format câu lệnh SQL trên console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


app.jwt.secret=${JWT_SECRET}
# 15 phút
app.jwt.access-expiration-ms=900000
# 7 ngày
app.jwt.refresh-expiration-ms=604800000
# dev (http) để false, production (https) phải để true
app.cookie.secure=false